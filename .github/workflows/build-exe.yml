name: Build Exe Tool

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    # 1. 检查代码
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. 安装 Python
    - name: Set up Python
      uses: actions/setup-python@v5 # 已更新版本，修复警告
      with:
        python-version: '3.10'

    # 3. 安装 PyInstaller
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller

    # 4. 强制修正文件名，并执行打包
    - name: Build the exe
      run: |
        # 无论你的文件叫 .py 还是 .py.py，都先重命名，确保绝对能找到
        ren "桌面整理小助手.py.py" "桌面整理小助手.py"
        pyinstaller -F -w --name "桌面整理小助手" "桌面整理小助手.py"

    # 5. 上传打包好的文件
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: 桌面整理小助手-exe
        path: dist/
