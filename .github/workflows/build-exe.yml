name: Build Exe Tool

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller

    - name: Find and build the exe
      run: |
        # 第一步：看看当前目录下到底有哪些文件
        dir
        # 第二步：找出所有 .py 文件（看看它到底叫什么）
        $pyfiles = Get-ChildItem -Filter *.py
        Write-Host "Found Python file: $($pyfiles.Name)"
        
        # 第三步：直接用找到的文件名进行打包
        pyinstaller -F -w --name "桌面整理小助手" "$($pyfiles.Name)"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: 桌面整理小助手-exe
        path: dist/
